version: "3.9"

services:
  backend:
    build: ./backend
    container_name: ppe-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ppe_db:/app/data
    environment:
      - DATABASE_URL=sqlite:///./ppe_compliance.db
      - MODEL_PATH=yolov8n.pt
      - CORS_ORIGINS=http://localhost:3000
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ppe-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ppe_db:
